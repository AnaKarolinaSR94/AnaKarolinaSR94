name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:           # botão "Run workflow" manual
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#C586C0&color_dots=#ebedf0,#c6e6df,#8fd3c3,#4EC9B0,#2f8f7b
            dist/snake-dark.svg?palette=github-dark&color_snake=#C586C0&color_dots=#1E1E1E,#1d3b36,#2a6b5f,#3ea591,#4EC9B0

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
